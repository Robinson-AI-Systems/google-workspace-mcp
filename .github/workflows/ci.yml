name: ci
on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres that lives only for this run, so the database tests
    # run on every change without touching the real (Neon) database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Robinson-AI-Systems/robinsons-toolkit-hub
          ref: 570e597ab865359072db43d1ab884ab456832207
          path: .rtc-hub
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-not-a-secret@127.0.0.1:5432/postgres
      - run: npm run test:rtc
      - run: node scripts/rtc-conformance-ci.mjs
