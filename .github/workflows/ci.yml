name: ci
on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

# Replace superseded PR runs, but preserve every exact post-merge main run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Independent verification families run together, each SQL family with its own
# disposable database. Keep test as the existing required aggregate check.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ci-phase.mjs --budget-seconds 180 -- npm test

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ci-phase.mjs --budget-seconds 180 -- npm run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-not-a-secret@127.0.0.1:5432/postgres

  rtc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Robinson-AI-Systems/robinsons-toolkit-hub
          ref: f173a0aeb070f1ca52188e9acab5bcccf53d81c7
          path: .rtc-hub
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ci-phase.mjs --budget-seconds 180 -- npm run test:rtc
      - run: node scripts/ci-phase.mjs --budget-seconds 180 -- node scripts/rtc-conformance-ci.mjs
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-not-a-secret@127.0.0.1:5432/postgres

  test:
    name: test
    if: always()
    needs: [check, unit, db, rtc]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification family
        env:
          CHECK: ${{ needs.check.result }}
          UNIT: ${{ needs.unit.result }}
          DB: ${{ needs.db.result }}
          RTC: ${{ needs.rtc.result }}
        run: |
          test "$CHECK" = success
          test "$UNIT" = success
          test "$DB" = success
          test "$RTC" = success
