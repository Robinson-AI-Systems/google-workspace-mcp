name: v1 real live public acceptance
on:
  pull_request:
    paths:
      - 'scripts/v1-live-public-smoke.mjs'
      - 'scripts/v1-live-public-smoke.test.mjs'
      - '.github/workflows/v1-live-public.yml'
  push:
    branches: [live]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: v1-live-public-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  live-public:
    name: real-source-pinned-anonymous-https
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Local adversarial source contract
        run: node --test scripts/v1-live-public-smoke.test.mjs
      - name: Independently read exact live GitHub revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LIVE_SHA="$(gh api "repos/$GH_REPO/git/ref/heads/live" --jq '.object.sha')"
          [[ "$LIVE_SHA" =~ ^[a-f0-9]{40}$ ]]
          echo "V1_EXPECTED_LIVE_SHA=$LIVE_SHA" >> "$GITHUB_ENV"
          echo "Target live revision: ${LIVE_SHA:0:12}"
      - name: Independently verify real Vercel public HTTPS, no credentials
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            # A live push starts an asynchronous production deployment.
            # Retry ONLY while the failure is the not-yet-switched source
            # signal, with a window that covers a full production build;
            # any other failure is a real defect and fails at once.
            for attempt in $(seq 1 52); do
              if out="$(node scripts/v1-live-public-smoke.mjs --expected-live "$V1_EXPECTED_LIVE_SHA" 2>&1)"; then
                echo "$out"
                exit 0
              fi
              echo "$out"
              if [[ "$out" != *"live_deployment_source_mismatch"* ]]; then exit 1; fi
              if [[ "$attempt" == "52" ]]; then exit 1; fi
              sleep 15
            done
          else
            node scripts/v1-live-public-smoke.mjs --expected-live "$V1_EXPECTED_LIVE_SHA"
          fi
